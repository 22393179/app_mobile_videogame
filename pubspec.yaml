name: app_mobile_videogame
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Dependencias principales
  flutter_dotenv: ^6.0.0
  http: ^1.5.0
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8
  connectivity_plus: ^6.0.2
  google_fonts: ^6.2.0
  flutter_svg: ^2.0.10+1
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_storage: ^12.0.0
  image_picker: ^1.0.7
  flutter_launcher_icons: ^0.14.4
  rename: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - .env
  fonts:
    - family: PixelifySans
      fonts:
        - asset: assets/fonts/PixelifySans-Bold.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
